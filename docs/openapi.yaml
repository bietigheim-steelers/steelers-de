openapi: 3.0.3
info:
  title: Steelers App API
  version: 1.0.0
  description: |
    Read-only JSON-API der Contao-Installation (steelers.de) für die mobile App (iOS/Android).
    Contao bleibt die einzige Datenquelle, die App pflegt keine eigenen Inhalte.

    **Allgemein**
    - Alle Antworten sind UTF-8-JSON im Envelope `{ "data": …, "meta": … }`.
    - Nur veröffentlichte Datensätze (inkl. Start/Stop-Zeitraum) werden ausgeliefert.
    - Zeitangaben sind ISO 8601 mit Zeitzone (`Europe/Berlin`), Datumsangaben `YYYY-MM-DD`.
    - Bild- und Datei-URLs sind immer absolut.
    - Antworten tragen `Cache-Control` und `ETag`; die App sendet `If-None-Match` und erhält ggf. `304`.
    - Unbekannte Felder und unbekannte Block-Typen muss die App ignorieren (Abwärtskompatibilität).
    - Content-Blöcke sind in `docs/app-integration.md` (Abschnitt „Bausteine“) beschrieben; hier das Schema `Block`.

    **Zwei Ebenen**
    1. *Daten* (`/news`, `/games`, `/standings`, `/players`, `/partners`): fachliche Inhalte, die schon in Contao gepflegt werden.
    2. *App-Aufbau* (`/app/config`, `/app/screens/{key}`): im Backend-Bereich „App“ gepflegte Navigation und Screens.
       Die App besitzt einen festen Satz an Bausteinen (Block-Typen) und Design; Contao bestimmt nur, welche
       Bausteine in welcher Reihenfolge mit welchen Texten erscheinen. Neue Block-Typen brauchen ein App-Release,
       alles andere (Texte, Reihenfolge, Ein-/Ausblenden) nicht. Die App legt die letzte Konfiguration im Cache ab
       und liefert eine eingebaute Standardkonfiguration mit.
    3. Einbindungen von Webseiten-Inhalten (Artikel, Inhaltselemente) löst der Server auf; die App erhält
       ausschließlich fertige Blöcke.

    **Umsetzungsstand:** `/news`, `/games`, `/standings`, `/players` und `/partners` sind in Contao
    umgesetzt (Phase 1). `/app/*` (Phase 2) und `/devices` (Phase 3) sind noch Spezifikation.
    Die Parameter `perPage` (max. 50) und `since` gibt es nur bei `/news`.
  contact:
    name: Bietigheim Steelers
    url: https://www.steelers.de
servers:
  - url: https://www.steelers.de/api/v1
    description: Produktion
  - url: https://dev.steelers.de/api/v1
    description: Entwicklung
  - url: http://localhost:5388/api/v1
    description: Lokale Docker-Umgebung
tags:
  - name: News
  - name: Spielbetrieb
    description: Spielplan, Ergebnisse und Tabelle
  - name: Kader
  - name: Partner
  - name: App-Konfiguration
    description: Navigation, Schalter und Screens aus dem Backend-Bereich „App“
  - name: Push
    description: Geräteregistrierung für Push-Benachrichtigungen (FCM)
security:
  - AppKey: []
paths:
  /news:
    get:
      tags: [News]
      summary: News-Liste
      description: Titel, Teaser und Bild. Kein Volltext.
      operationId: listNews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: category
          in: query
          description: Alias einer News-Kategorie (codefog/news_categories).
          schema: { type: string }
        - name: archive
          in: query
          description: |
            Kommagetrennte News-Archiv-IDs. Ohne Angabe alle Archive außer dem Videoportal (ID 7),
            dessen Cron-Importe sonst die Liste füllen würden.
          schema: { type: string, example: '1,2' }
        - name: since
          in: query
          description: Nur Einträge mit `updatedAt` nach diesem Zeitpunkt (Delta-Sync).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NewsItem' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /news/{id}:
    get:
      tags: [News]
      summary: Einzelne News
      operationId: getNews
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NewsItem' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
  /games:
    get:
      tags: [Spielbetrieb]
      summary: Spielplan und Ergebnisse
      operationId: listGames
      parameters:
        - name: round
          in: query
          description: |
            ID der Runde/Saison (`tl_tilastot_client_rounds`). Ohne Angabe die Runde des nächsten
            anstehenden Spiels, sonst die des letzten Spiels.
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, live, finished]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: team
          in: query
          description: Nur Spiele dieses Teams (`Team.id`, also die `tilastotid`).
          schema: { type: integer }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Game' }
        '304': { $ref: '#/components/responses/NotModified' }
  /games/{id}:
    get:
      tags: [Spielbetrieb]
      summary: Einzelnes Spiel
      operationId: getGame
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Game' }
        '404': { $ref: '#/components/responses/NotFound' }
  /standings:
    get:
      tags: [Spielbetrieb]
      summary: Tabelle
      operationId: listStandings
      parameters:
        - name: round
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StandingsRow' }
        '304': { $ref: '#/components/responses/NotModified' }
  /players:
    get:
      tags: [Kader]
      summary: Kader
      operationId: listPlayers
      parameters:
        - name: position
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Player' }
        '304': { $ref: '#/components/responses/NotModified' }
  /players/{id}:
    get:
      tags: [Kader]
      summary: Einzelner Spieler
      operationId: getPlayer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
        '404': { $ref: '#/components/responses/NotFound' }
  /partners:
    get:
      tags: [Partner]
      summary: Partner und Sponsoren
      operationId: listPartners
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Partner' }
        '304': { $ref: '#/components/responses/NotModified' }
  /app/config:
    get:
      tags: [App-Konfiguration]
      summary: Navigation und Schalter
      description: |
        Einstiegspunkt der App beim Start. Liefert Tabs, Menü, Startscreen und Schalter. Einträge, die für
        `platform`/`appVersion` nicht freigegeben sind oder außerhalb von Start/Stop liegen, fehlen in der Antwort.
        Kurz cachen (ca. 60 s); die App fällt bei Fehlern auf die zuletzt gespeicherte oder eingebaute Konfiguration zurück.
      operationId: getAppConfig
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AppConfig' }
        '304': { $ref: '#/components/responses/NotModified' }
  /app/screens/{key}:
    get:
      tags: [App-Konfiguration]
      summary: Screen als Blöcke
      description: |
        Die Blöcke eines Screens in der im Backend festgelegten Reihenfolge. Eingebundene Webseiten-Inhalte
        (Artikel, Inhaltselemente) sind bereits in einfache Blöcke aufgelöst. Inhaltselemente ohne App-Darstellung
        werden ausgelassen.
      operationId: getAppScreen
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, example: home }
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Screen' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices:
    post:
      tags: [Push]
      summary: Gerät registrieren oder aktualisieren
      description: |
        Idempotent über `token`. Die App ruft dies beim Start, bei Token-Wechsel und bei Änderung der
        Benachrichtigungs-Einstellungen auf. Der Server abonniert die Topics bei FCM.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Aktualisiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeviceRegistration' }
        '201':
          description: Neu angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeviceRegistration' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /devices/{token}:
    delete:
      tags: [Push]
      summary: Gerät abmelden
      operationId: unregisterDevice
      parameters:
        - name: token
          in: path
          required: true
          description: FCM-Token (URL-kodiert).
          schema: { type: string }
      responses:
        '204':
          description: Abgemeldet (auch wenn das Token unbekannt war)
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    AppKey:
      type: apiKey
      in: header
      name: X-App-Key
      description: |
        Einfacher App-Schlüssel gegen beiläufigen Missbrauch (kein Nutzer-Login). Die Inhalte sind öffentlich;
        ist der Schutz am Server abgeschaltet, kann der Header entfallen.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Platform:
      name: platform
      in: query
      description: Plattform der App; Einträge können auf eine Plattform beschränkt sein.
      schema: { type: string, enum: [ios, android] }
    AppVersion:
      name: appVersion
      in: query
      description: Installierte App-Version (SemVer); Einträge mit höherer `minAppVersion` werden ausgelassen.
      schema: { type: string, example: 1.2.0 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  headers:
    ETag:
      description: Entity-Tag für bedingte Anfragen (`If-None-Match`).
      schema: { type: string }
    CacheControl:
      description: z. B. `public, max-age=120`.
      schema: { type: string }
  responses:
    NotModified:
      description: Inhalt unverändert (`If-None-Match` passt).
    Unauthorized:
      description: Fehlender oder ungültiger `X-App-Key`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nicht gefunden oder nicht veröffentlicht.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ungültige Eingabe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate-Limit überschritten.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string, example: Eintrag nicht gefunden. }
            details:
              type: object
              additionalProperties: true
    PageMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
    Image:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        alt: { type: string, nullable: true }
        caption: { type: string, nullable: true }
    NewsItem:
      type: object
      required: [id, title, date, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        date: { type: string, format: date-time, description: Veröffentlichungsdatum (`date` + `time`). }
        updatedAt: { type: string, format: date-time, description: Aus `tstamp`. }
        teaser:
          type: string
          nullable: true
          description: Teaser als Klartext, Entities dekodiert.
        image:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              alias: { type: string }
        featured: { type: boolean }
        webUrl:
          type: string
          format: uri
          description: Kanonische Adresse auf steelers.de (Teilen-Funktion).
        gameId:
          type: integer
          nullable: true
          description: Verknüpftes Spiel (`tl_news.game_id`).
        video:
          type: object
          nullable: true
          description: Nur bei Videoportal-Einträgen.
          properties:
            url: { type: string, format: uri }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: '`tilastotid` des Teams (rundenübergreifend gleich, nicht die Datenbank-ID).' }
        name: { type: string }
        shortName: { type: string, nullable: true }
        city: { type: string, nullable: true }
        logo:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
    Game:
      type: object
      required: [id, round, home, away, startsAt, status]
      properties:
        id: { type: integer }
        round: { type: integer }
        gameday: { type: integer, nullable: true, description: Spieltag }
        startsAt:
          type: string
          format: date-time
          description: Aus `gamedate` + `gametime`.
        location: { type: string, nullable: true }
        spectators: { type: integer, nullable: true }
        home: { $ref: '#/components/schemas/Team' }
        away: { $ref: '#/components/schemas/Team' }
        homeScore: { type: integer, nullable: true }
        awayScore: { type: integer, nullable: true }
        periodScores:
          type: array
          description: Drittelergebnisse, z. B. `["1:0","2:2","0:1"]`.
          items: { type: string, pattern: '^\d+:\d+$' }
        resultType:
          type: string
          nullable: true
          enum: [regulation, overtime, shootout, awarded]
          description: '`awarded` = Spielwertung. Nur gesetzt, wenn ein Ergebnis vorliegt.'
        status:
          type: string
          enum: [upcoming, live, finished]
          description: |
            `finished`, sobald der Import das Spiel als beendet markiert hat. Ohne dieses Flag gilt ein
            Spiel bis vier Stunden nach Beginn als `live`, danach als `finished` (wenn ein Ergebnis
            vorliegt).
        optional: { type: boolean, description: Optionales Spiel (z. B. Playoff-Serie). }
        tickets:
          type: object
          nullable: true
          properties:
            eventimUrl: { type: string, format: uri, nullable: true }
            magentaUrl: { type: string, format: uri, nullable: true }
    StandingsRow:
      type: object
      required: [rank, team, games, points]
      properties:
        rank: { type: integer }
        team: { $ref: '#/components/schemas/Team' }
        games: { type: integer }
        regulationWins: { type: integer }
        overtimeWins: { type: integer }
        penaltyWins: { type: integer }
        penaltyLosses: { type: integer }
        overtimeLosses: { type: integer }
        regulationLosses: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        goalDifference: { type: integer }
        penalties: { type: integer, nullable: true, description: Strafminuten }
        points: { type: integer }
    Player:
      type: object
      required: [id, firstname, lastname]
      properties:
        id: { type: integer }
        alias: { type: string }
        jersey: { type: integer, nullable: true }
        firstname: { type: string }
        lastname: { type: string }
        position: { type: string, nullable: true }
        nationality: { type: string, nullable: true }
        shoots: { type: string, nullable: true, description: Schusshand }
        birthplace: { type: string, nullable: true }
        birthday: { type: string, format: date, nullable: true }
        height: { type: integer, nullable: true, description: cm }
        weight: { type: integer, nullable: true, description: kg }
        steelersSince: { type: string, nullable: true }
        about:
          type: string
          nullable: true
          description: Freitext, auf einfaches HTML (`p, strong, em, a, ul, ol, li, br`) reduziert.
        pictures:
          type: array
          description: In der in Contao gepflegten Reihenfolge.
          items: { $ref: '#/components/schemas/Image' }
    Partner:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, description: '`displayname`, sonst `name`.' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/KeyLabel' }
        branches:
          type: array
          items: { $ref: '#/components/schemas/KeyLabel' }
        url: { type: string, format: uri, nullable: true }
        teaser: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logo:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
        photo:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
    KeyLabel:
      type: object
      required: [key, label]
      properties:
        key: { type: string, example: platin }
        label: { type: string, example: Platinpartner }
    AppConfig:
      type: object
      required: [revision, home, tabs]
      properties:
        revision:
          type: integer
          description: Änderungsstand der gesamten App-Konfiguration (größter `tstamp`); die App erkennt damit Änderungen.
        home:
          type: string
          description: Schlüssel des Startscreens.
          example: home
        tabs:
          type: array
          description: Untere Navigation (üblich 3–5 Einträge).
          items: { $ref: '#/components/schemas/NavItem' }
        menu:
          type: array
          description: Weitere Einträge (z. B. unter „Mehr“).
          items: { $ref: '#/components/schemas/NavItem' }
        flags:
          type: object
          description: Frei benannte Schalter (z. B. `ticketShop`) zum Ein-/Ausblenden von App-Funktionen.
          additionalProperties:
            oneOf:
              - { type: boolean }
              - { type: string }
              - { type: number }
          example: { ticketShop: true }
    NavItem:
      type: object
      required: [key, title, type]
      properties:
        key: { type: string, example: news }
        title: { type: string, example: News }
        icon:
          type: string
          nullable: true
          description: Schlüssel aus dem Icon-Satz der App; unbekannte Schlüssel zeigt die App ohne Icon.
        type:
          type: string
          enum: [screen, native, link]
          description: |
            `screen` = Screen aus `/app/screens/{key}`, `native` = fest in der App eingebaute Funktion
            (z. B. Einstellungen), `link` = externe Seite (`url`).
        url: { type: string, format: uri, nullable: true }
    Screen:
      type: object
      required: [key, title, blocks, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        updatedAt: { type: string, format: date-time }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/Block' }
    Block:
      description: |
        Baustein eines Screens. Die App rendert je `type` eine eigene Flutter-Komponente und ignoriert
        unbekannte Typen. Weitere Typen können ohne API-Versionssprung hinzukommen.

        *Inhaltsblöcke* (`headline` bis `promo`) bringen ihren Inhalt mit. *Datenblöcke* (`news_list` bis `partners`)
        enthalten nur Konfiguration; die App lädt die Daten selbst über die Daten-Endpunkte.
        Links (`url`) sind `https://…`-Adressen oder `app://screen/{key}` für einen Screen der App.
      oneOf:
        - $ref: '#/components/schemas/HeadlineBlock'
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/ListBlock'
        - $ref: '#/components/schemas/ButtonBlock'
        - $ref: '#/components/schemas/DownloadBlock'
        - $ref: '#/components/schemas/VideoBlock'
        - $ref: '#/components/schemas/PromoBlock'
        - $ref: '#/components/schemas/NewsListBlock'
        - $ref: '#/components/schemas/NextGameBlock'
        - $ref: '#/components/schemas/GamesBlock'
        - $ref: '#/components/schemas/StandingsBlock'
        - $ref: '#/components/schemas/RosterBlock'
        - $ref: '#/components/schemas/PartnersBlock'
      discriminator:
        propertyName: type
        mapping:
          headline: '#/components/schemas/HeadlineBlock'
          text: '#/components/schemas/TextBlock'
          image: '#/components/schemas/ImageBlock'
          list: '#/components/schemas/ListBlock'
          button: '#/components/schemas/ButtonBlock'
          download: '#/components/schemas/DownloadBlock'
          video: '#/components/schemas/VideoBlock'
          promo: '#/components/schemas/PromoBlock'
          news_list: '#/components/schemas/NewsListBlock'
          next_game: '#/components/schemas/NextGameBlock'
          games: '#/components/schemas/GamesBlock'
          standings: '#/components/schemas/StandingsBlock'
          roster: '#/components/schemas/RosterBlock'
          partners: '#/components/schemas/PartnersBlock'
    HeadlineBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [headline] }
        text: { type: string }
        level: { type: integer, minimum: 1, maximum: 6, default: 2 }
    TextBlock:
      type: object
      required: [type, html]
      properties:
        type: { type: string, enum: [text] }
        html:
          type: string
          description: Per HTML-Sanitizer auf `p, strong, em, a, ul, ol, li, br` reduziert.
    ImageBlock:
      type: object
      required: [type, image]
      properties:
        type: { type: string, enum: [image] }
        image: { $ref: '#/components/schemas/Image' }
        linkUrl: { type: string, format: uri, nullable: true }
    ListBlock:
      type: object
      required: [type, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean, default: false }
        items:
          type: array
          items: { type: string }
    ButtonBlock:
      type: object
      required: [type, label, url]
      properties:
        type: { type: string, enum: [button] }
        label: { type: string }
        url: { type: string, format: uri }
        external: { type: boolean, description: true = im Browser öffnen. }
    DownloadBlock:
      type: object
      required: [type, label, url]
      properties:
        type: { type: string, enum: [download] }
        label: { type: string }
        url: { type: string, format: uri }
        mimeType: { type: string, nullable: true }
        size: { type: integer, nullable: true, description: Bytes }
    VideoBlock:
      type: object
      required: [type, provider, id]
      properties:
        type: { type: string, enum: [video] }
        provider: { type: string, enum: [youtube, vimeo, file] }
        id: { type: string, description: Video-ID bzw. bei `file` die absolute URL. }
        title: { type: string, nullable: true }
    PromoBlock:
      type: object
      required: [type, title]
      properties:
        type: { type: string, enum: [promo] }
        title: { type: string }
        text: { type: string, nullable: true }
        image:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
        label: { type: string, nullable: true, description: Beschriftung des Buttons. }
        url: { type: string, nullable: true, description: 'https://… oder app://screen/{key}' }
    NewsListBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [news_list] }
        title: { type: string, nullable: true }
        limit: { type: integer, default: 5 }
        category: { type: string, nullable: true, description: 'Alias der News-Kategorie (wie `/news?category=`).' }
        layout: { type: string, enum: [list, carousel], default: list }
    NextGameBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [next_game] }
        title: { type: string, nullable: true }
    GamesBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [games] }
        title: { type: string, nullable: true }
        status: { type: string, enum: [upcoming, finished], default: upcoming }
        limit: { type: integer, nullable: true }
    StandingsBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [standings] }
        title: { type: string, nullable: true }
        compact: { type: boolean, default: false, description: 'Nur Platz, Team und Punkte.' }
    RosterBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [roster] }
        title: { type: string, nullable: true }
        position: { type: string, nullable: true, description: 'Filter wie bei `/players`.' }
    PartnersBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [partners] }
        title: { type: string, nullable: true }
        category: { type: string, nullable: true, description: 'Filter wie bei `/partners`.' }
        layout: { type: string, enum: [grid, slider], default: grid }
    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: FCM-Registrierungstoken.
          maxLength: 4096
        platform:
          type: string
          enum: [ios, android]
        topics:
          type: array
          description: Gewünschte Benachrichtigungs-Kanäle. Weggelassen = alle.
          items:
            type: string
            enum: [news, games, results]
          uniqueItems: true
        appVersion: { type: string, example: 1.0.3 }
        locale: { type: string, example: de-DE }

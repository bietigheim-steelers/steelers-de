services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  App\:
    resource: ../src
    exclude: ../src/{Entity,Migrations,Model,Resources,Tests,Widget}

  App\Utils\:
    resource: ../src/Utils
    public: true

  App\Controller\:
    resource: ../src/Controller
    public: true
    tags: [controller.service_arguments]

  App\EventListener\GeneratePageListener:
    tags:
      - { name: contao.hook, hook: generatePage }
    arguments:
      - "%mixpanel_project_token%"

  App\Controller\FrontendModule\ScorerModule:
    tags:
      - name: contao.frontend_module
        category: tilastot
        template: mod_scorer
        type: scorer
  App\Controller\FrontendModule\CampsModule:
    tags:
      - name: contao.frontend_module
        category: tilastot
        template: mod_camps
        type: camps
  App\Controller\FrontendModule\AuctionModule:
    tags:
      - name: contao.frontend_module
        category: tilastot
        template: mod_auction
        type: auction

  App\Dca\SponsorsEventDca:
    public: true

  App\Dca\PartnersDca:
    public: true

  # --- CleverReach-REST-API -------------------------------------------------
  # Genutzt von App\EventListener\CleverReachFormListener. Den API-Token traegt man als
  # cleverreach_api_token in config/parameters.yml ein (nicht im Git). Der Parameter MUSS
  # vor dem Deploy auf dem Zielsystem stehen, sonst startet der Container nicht.
  # Der Timeout gilt je Anfrage, der Besucher wartet darauf.
  cleverreach.psr17_factory:
    class: Nyholm\Psr7\Factory\Psr17Factory

  # Kein "@=service('http_client')": der Dienst ist privat und im kompilierten Container
  # entfernt bzw. eingebettet, der Ausdruck wuerde zur Laufzeit scheitern. Eine Factory
  # mit Referenz wird dagegen schon beim Kompilieren aufgeloest.
  cleverreach.symfony_http_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['@http_client', 'withOptions']
    arguments:
      - { timeout: 8 }

  cleverreach.http_client:
    class: Symfony\Component\HttpClient\Psr18Client
    arguments:
      - '@cleverreach.symfony_http_client'
      - '@cleverreach.psr17_factory'
      - '@cleverreach.psr17_factory'

  CleverReach\SDK\CleverReachClient:
    arguments:
      $apiToken: '%cleverreach_api_token%'
      $httpClient: '@cleverreach.http_client'
      $requestFactory: '@cleverreach.psr17_factory'
      $streamFactory: '@cleverreach.psr17_factory'

twig:
  globals:
    project_dir: '%kernel.project_dir%'

# --- E-Mail-Versand ------------------------------------------------------
#
# Der ERSTE Transport ist der Standard, ueber den alle E-Mails laufen, die
# keinen eigenen Transport gewaehlt haben.
#
#   webseite  – klassischer SMTP-Versand (Zugangsdaten in parameters.yml).
#               Der Name MUSS "webseite" bleiben: tl_page.mailerTransport,
#               tl_form.mailerTransport (~35 Formulare) und das
#               Notification-Center-Gateway verweisen darauf.
#   m365_*    – Microsoft 365 ueber die Graph API (OAuth2 Client Credentials).
#               Kein SMTP, kein Benutzerpasswort, daher unabhaengig von der
#               erzwungenen MFA. Benoetigt eine App-Registrierung in Entra ID.
#
# Alle m365-Transports teilen sich EINE App-Registrierung. Unterschiedliche
# Absender brauchen trotzdem je einen eigenen Transport, weil Graph das
# Postfach aus dem Envelope-Sender ableitet (POST /users/{from}/sendMail)
# und dieser in Contao pro Transport ueber "from" festgelegt wird.
parameters:
  microsoft_graph_dsn: 'microsoftgraph+api://%microsoft_graph_client_id%:%microsoft_graph_client_secret%@default?tenantId=%microsoft_graph_tenant_id%'

framework:
  mailer:
    transports:
      webseite: '%env(MAILER_DSN)%'
      m365_noreply: '%microsoft_graph_dsn%'
      m365_ticketing: '%microsoft_graph_dsn%'
      m365_office: '%microsoft_graph_dsn%'

# Macht die Transports im Backend auswaehlbar (Seitenstruktur, Formulare,
# Notification-Center-Gateways). Angezeigt wird "<name> (<from>)".
#
# "from" erzwingt die Absenderadresse. Das ist bei Graph nicht optional: die
# Adresse muss ein echtes Postfach des Tenants sein, sonst wird der Versand
# abgelehnt – eine Besucheradresse aus einem Formular waere es nicht.
# Reply-To bleibt unangetastet, Antworten gehen also weiter an die fachliche
# Adresse.
contao:
  mailer:
    transports:
      webseite:
        from: ~
      m365_noreply:
        from: no-reply@steelers.de
      m365_ticketing:
        from: ticketing@steelers.de
      m365_office:
        from: office@steelers.de

app.tilastot.controller:
  controller: App\Controller\SeasonTicketController::order
  path: /seasonticket/order
  methods: POST
  # Kein "schemes: [https]" mehr: eine Scheme-Beschraenkung laesst einen POST
  # ueber http stillschweigend ins Leere laufen (404, Body weg) und machte die
  # Bestellung lokal untestbar. SeasonTicketController::order() lehnt eine
  # unverschluesselte Anfrage jetzt ausdruecklich ab -- ausser auf localhost.
  defaults:
    # Ohne _token_check hat Contao den REQUEST_TOKEN hier nie geprueft: die
    # Route liegt nicht im Contao-Scope, und der RequestTokenListener greift
    # nur bei _token_check true oder einem Contao-Request.
    _token_check: true
app.tilastot.seats_api:
  controller: App\Controller\SeatsApiController::getSeats
  path: /seasontickets/api/seats
  methods: GET

# Befristete Platzreservierung waehrend der Bestellung. Bewusst ohne
# schemes-Beschraenkung, damit sich das lokal ueber http testen laesst -- im
# Produktivbetrieb ruft die Seite diese Routen ohnehin ueber https auf.
app.tilastot.seats_hold:
  controller: App\Controller\SeatHoldController::hold
  path: /seasontickets/api/hold
  methods: POST
  defaults:
    _token_check: true

app.tilastot.seats_release:
  controller: App\Controller\SeatHoldController::release
  path: /seasontickets/api/release
  methods: POST
  defaults:
    _token_check: true

backend_season_ticket_download:
  controller: App\Controller\SeasonTicketDownloadController::triggerDownload
  path: /contao/seasontickets/download
  methods: GET
  defaults:
    _scope: backend

# --- App-API (read-only, Vertrag: docs/openapi.yaml) -----------------------
app_api_news:
  controller: App\Controller\Api\NewsController::list
  path: /api/v1/news
  methods: GET
app_api_news_detail:
  controller: App\Controller\Api\NewsController::detail
  path: /api/v1/news/{id}
  methods: GET
  requirements: { id: '\d+' }
app_api_videos:
  controller: App\Controller\Api\VideosController::list
  path: /api/v1/videos
  methods: GET
app_api_videos_detail:
  controller: App\Controller\Api\VideosController::detail
  path: /api/v1/videos/{id}
  methods: GET
  requirements: { id: '\d+' }
app_api_games:
  controller: App\Controller\Api\GamesController::list
  path: /api/v1/games
  methods: GET
app_api_games_detail:
  controller: App\Controller\Api\GamesController::detail
  path: /api/v1/games/{id}
  methods: GET
  requirements: { id: '\d+' }
app_api_standings:
  controller: App\Controller\Api\StandingsController::list
  path: /api/v1/standings
  methods: GET
app_api_players:
  controller: App\Controller\Api\PlayersController::list
  path: /api/v1/players
  methods: GET
app_api_players_detail:
  controller: App\Controller\Api\PlayersController::detail
  path: /api/v1/players/{id}
  methods: GET
  requirements: { id: '\d+' }
app_api_partners:
  controller: App\Controller\Api\PartnersController::list
  path: /api/v1/partners
  methods: GET

# --- App-Aufbau aus dem Backend-Bereich "App" -------------------------------
app_api_app_config:
  controller: App\Controller\Api\AppController::config
  path: /api/v1/app/config
  methods: GET
app_api_app_screen:
  controller: App\Controller\Api\AppController::screen
  path: /api/v1/app/screens/{key}
  methods: GET
  requirements: { key: '[A-Za-z0-9_.-]+' }

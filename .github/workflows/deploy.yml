on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
name: PROD // Deploy steelers.de
jobs:
  web-deploy:
    name: Deploy to Production 🚀
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: 🏗 build css and js
        uses: actions/setup-node@v6
        env:
          COMPOSE_TLS_VERSION: TLSv1_2
        with:
          node-version: 24
      - run: cd assets && npm ci
      - run: cd assets && npm run build

      # Deployer comes from Packagist instead of deployer.org (deployphp/action
      # downloads the phar from there, which makes the pipeline fragile).
      - name: 📦 Install Deployer
        run: |
          composer global require --no-interaction deployer/deployer:7.5.12
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H web01.steelers.de >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to prod
        run: dep deploy stage=prod
